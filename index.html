<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Excel Splitter - DTR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

h1 {
    margin-top: 0;
}

.upload-box {
    border: 2px dashed #999;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    margin: 20px 0;
}

input[type="file"] {
    margin: 15px;
}

select {
    padding: 10px;
    margin: 10px;
    min-width: 250px;
}

button {
    padding: 12px 22px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
    margin: 8px;
}

#splitBtn {
    background: #1976d2;
    color: white;
}

#downloadBtn {
    background: #2e7d32;
    color: white;
    display: none;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#status {
    margin-top: 20px;
    font-weight: bold;
}

.info {
    background: #f1f3f4;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
}

.info div {
    margin: 6px 0;
}

.success {
    margin-top: 15px;
    padding: 12px;
    background: #e8f5e9;
    border-radius: 7px;
}

</style>

</head>

<body>

<div class="container">

<h1>Excel Splitter</h1>

<div class="upload-box">

    <input
        type="file"
        id="fileInput"
        accept=".xlsx"
    >

    <br>

    <label>
        <b>Sheet:</b>
    </label>

    <select id="sheetSelect" disabled>
        <option>Select Excel first</option>
    </select>

    <br>

    <label>
        <b>Split By:</b>
    </label>

    <select id="columnSelect" disabled>
        <option>Select Sheet first</option>
    </select>

    <br>

    <button id="splitBtn" disabled>
        Split Excel
    </button>

    <button id="downloadBtn">
        Download ZIP
    </button>

</div>


<div class="info">

    <div>
        <b>File:</b>
        <span id="fileName">-</span>
    </div>

    <div>
        <b>Sheet:</b>
        <span id="selectedSheet">-</span>
    </div>

    <div>
        <b>Total Rows:</b>
        <span id="rowCount">-</span>
    </div>

    <div>
        <b>DTR Files:</b>
        <span id="fileCount">-</span>
    </div>

</div>


<div id="status"></div>

</div>


<script>

/*
=========================================================
GLOBAL VARIABLES
=========================================================
*/

let originalZip = null;

let workbookXML = null;

let sheetXML = null;

let selectedSheetName = "";

let selectedSheetPath = "";

let selectedColumn = null;

let generatedZIP = null;


/*
=========================================================
HELPER
=========================================================
*/

function cleanText(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value).trim();

}


/*
=========================================================
XML PARSER
=========================================================
*/

function parseXML(text) {

    return new DOMParser().parseFromString(
        text,
        "application/xml"
    );

}


/*
=========================================================
XML SERIALIZER
=========================================================
*/

function serializeXML(xml) {

    return new XMLSerializer().serializeToString(xml);

}


/*
=========================================================
READ CELL VALUE

Handles:
- inlineStr
- shared strings
- normal numeric/text values
=========================================================
*/

async function getCellValue(
    cell,
    sharedStrings
) {

    if (!cell) {
        return "";
    }


    const type =
        cell.getAttribute("t");


    /*
    inline string
    */

    if (type === "inlineStr") {

        const nodes =
            cell.getElementsByTagNameNS(
                "http://schemas.openxmlformats.org/spreadsheetml/2006/main",
                "t"
            );

        let text = "";

        for (const node of nodes) {
            text += node.textContent;
        }

        return cleanText(text);

    }


    /*
    normal value
    */

    const v =
        cell.getElementsByTagNameNS(
            "http://schemas.openxmlformats.org/spreadsheetml/2006/main",
            "v"
        )[0];


    if (!v) {
        return "";
    }


    let value =
        v.textContent;


    /*
    Shared string
    */

    if (
        type === "s" &&
        sharedStrings
    ) {

        const index =
            parseInt(value, 10);


        if (
            !isNaN(index) &&
            sharedStrings[index] !== undefined
        ) {

            return cleanText(
                sharedStrings[index]
            );

        }

    }


    return cleanText(value);

}


/*
=========================================================
READ SHARED STRINGS
=========================================================
*/

async function readSharedStrings(
    zip
) {

    const file =
        zip.file(
            "xl/sharedStrings.xml"
        );


    if (!file) {
        return [];
    }


    const text =
        await file.async("text");


    const xml =
        parseXML(text);


    const ns =
        "http://schemas.openxmlformats.org/spreadsheetml/2006/main";


    const siNodes =
        xml.getElementsByTagNameNS(
            ns,
            "si"
        );


    const result = [];


    for (const si of siNodes) {

        const tNodes =
            si.getElementsByTagNameNS(
                ns,
                "t"
            );


        let textValue = "";


        for (const t of tNodes) {

            textValue +=
                t.textContent;

        }


        result.push(
            textValue
        );

    }


    return result;

}


/*
=========================================================
GET WORKBOOK SHEETS
=========================================================
*/

async function getWorkbookSheets(
    zip
) {

    const workbookFile =
        zip.file(
            "xl/workbook.xml"
        );


    if (!workbookFile) {
        throw new Error(
            "workbook.xml nahi mila."
        );
    }


    const text =
        await workbookFile.async("text");


    const xml =
        parseXML(text);


    const ns =
        "http://schemas.openxmlformats.org/spreadsheetml/2006/main";


    const sheets =
        xml.getElementsByTagNameNS(
            ns,
            "sheet"
        );


    const result = [];


    for (const sheet of sheets) {

        result.push({

            name:
                sheet.getAttribute("name"),

            rid:
                sheet.getAttribute(
                    "r:id"
                )

        });

    }


    return {
        xml,
        sheets
    };

}


/*
=========================================================
FIND SHEET FILE PATH
=========================================================
*/

async function findSheetPath(
    zip,
    relationshipId
) {

    const relFile =
        zip.file(
            "xl/_rels/workbook.xml.rels"
        );


    if (!relFile) {

        throw new Error(
            "workbook relationships nahi mile."
        );

    }


    const text =
        await relFile.async("text");


    const xml =
        parseXML(text);


    const rels =
        xml.getElementsByTagName(
            "Relationship"
        );


    for (const rel of rels) {

        if (
            rel.getAttribute("Id") ===
            relationshipId
        ) {

            let target =
                rel.getAttribute(
                    "Target"
                );


            if (
                target.startsWith("/")
            ) {

                target =
                    target.substring(1);

            }
            else if (
                target.startsWith("xl/")
            ) {

                // already correct

            }
            else {

                target =
                    "xl/" + target;

            }


            return target;

        }

    }


    return null;

}


/*
=========================================================
COLUMN LETTER → NUMBER
=========================================================
*/

function columnLetterToNumber(
    letters
) {

    let number = 0;

    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        number =
            number * 26 +
            (
                letters.charCodeAt(i) -
                64
            );

    }

    return number;

}


/*
=========================================================
CELL REFERENCE COLUMN
=========================================================
*/

function getCellColumn(
    reference
) {

    const match =
        reference.match(
            /^([A-Z]+)/
        );


    if (!match) {
        return null;
    }


    return columnLetterToNumber(
        match[1]
    );

}


/*
=========================================================
LOAD EXCEL
=========================================================
*/

document
.getElementById("fileInput")
.addEventListener(
    "change",
    async function(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        try {

            document.getElementById(
                "status"
            ).textContent =
                "Excel read ho raha hai...";


            const buffer =
                await file.arrayBuffer();


            originalZip =
                await JSZip.loadAsync(
                    buffer
                );


            const workbookData =
                await getWorkbookSheets(
                    originalZip
                );


            workbookXML =
                workbookData.xml;


            const sheetSelect =
                document.getElementById(
                    "sheetSelect"
                );


            sheetSelect.innerHTML =
                "";


            for (
                const sheet
                of workbookData.sheets
            ) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    sheet.name;


                option.textContent =
                    sheet.name;


                sheetSelect.appendChild(
                    option
                );

            }


            sheetSelect.disabled =
                false;


            /*
            Prefer Sheet3
            */

            let defaultSheet =
                workbookData.sheets.find(
                    s =>
                        s.name
                            .toLowerCase() ===
                        "sheet3"
                            .toLowerCase()
                );


            if (!defaultSheet) {

                defaultSheet =
                    workbookData.sheets[0];

            }


            sheetSelect.value =
                defaultSheet.name;


            await loadSelectedSheet(
                defaultSheet.name
            );


            document.getElementById(
                "fileName"
            ).textContent =
                file.name;


            document.getElementById(
                "status"
            ).textContent =
                "Excel loaded successfully.";

        }

        catch(error) {

            console.error(error);

            alert(
                "Excel read nahi ho paya:\n\n" +
                error.message
            );

            document.getElementById(
                "status"
            ).textContent =
                "Error.";

        }

    }
);


/*
=========================================================
SHEET CHANGE
=========================================================
*/

document
.getElementById("sheetSelect")
.addEventListener(
    "change",
    async function() {

        await loadSelectedSheet(
            this.value
        );

    }
);


/*
=========================================================
LOAD SELECTED SHEET
=========================================================
*/

async function loadSelectedSheet(
    sheetName
) {

    selectedSheetName =
        sheetName;


    const workbookData =
        await getWorkbookSheets(
            originalZip
        );


    const sheet =
        workbookData.sheets.find(
            s =>
                s.name ===
                sheetName
        );


    if (!sheet) {

        throw new Error(
            "Sheet nahi mili: " +
            sheetName
        );

    }


    selectedSheetPath =
        await findSheetPath(
            originalZip,
            sheet.rid
        );


    if (!selectedSheetPath) {

        throw new Error(
            "Sheet XML nahi mila."
        );

    }


    const sheetFile =
        originalZip.file(
            selectedSheetPath
        );


    const text =
        await sheetFile.async(
            "text"
        );


    sheetXML =
        parseXML(text);


    /*
    Shared strings
    */

    const sharedStrings =
        await readSharedStrings(
            originalZip
        );


    /*
    Find first row
    */

    const ns =
        "http://schemas.openxmlformats.org/spreadsheetml/2006/main";


    const sheetData =
        sheetXML.getElementsByTagNameNS(
            ns,
            "sheetData"
        )[0];


    if (!sheetData) {

        throw new Error(
            "Sheet data nahi mila."
        );

    }


    const rows =
        sheetData.getElementsByTagNameNS(
            ns,
            "row"
        );


    if (!rows.length) {

        throw new Error(
            "Sheet mein rows nahi hain."
        );

    }


    /*
    Header row
    */

    const headerRow =
        rows[0];


    const cells =
        headerRow.getElementsByTagNameNS(
            ns,
            "c"
        );


    const columnSelect =
        document.getElementById(
            "columnSelect"
        );


    columnSelect.innerHTML =
        "";


    /*
    Read all header cells
    */

    for (const cell of cells) {

        const ref =
            cell.getAttribute("r");


        const column =
            getCellColumn(ref);


        const value =
            await getCellValue(
                cell,
                sharedStrings
            );


        const option =
            document.createElement(
                "option"
            );


        option.value =
            column;


        option.textContent =
            value ||
            "Column " + column;


        columnSelect.appendChild(
            option
        );

    }


    /*
    Automatically choose DTR No.
    */

    let dtrOption = null;


    for (
        const option
        of columnSelect.options
    ) {

        const text =
            option.textContent
                .toLowerCase()
                .replace(
                    /[\s._-]/g,
                    ""
                );


        if (
            text.includes("dtrno") ||
            text === "dtr"
        ) {

            dtrOption =
                option;

            break;

        }

    }


    /*
    Your Sheet3 has DTR No. in Column L.
    */

    if (dtrOption) {

        columnSelect.value =
            dtrOption.value;

    }
    else {

        columnSelect.value =
            "12";

    }


    columnSelect.disabled =
        false;


    document.getElementById(
        "splitBtn"
    ).disabled =
        false;


    document.getElementById(
        "selectedSheet"
    ).textContent =
        sheetName;


    document.getElementById(
        "rowCount"
    ).textContent =
        Math.max(
            rows.length - 1,
            0
        );

}


/*
=========================================================
SPLIT
=========================================================
*/

document
.getElementById("splitBtn")
.addEventListener(
    "click",
    async function() {

        if (
            !originalZip ||
            !sheetXML
        ) {

            alert(
                "Pehle Excel upload karein."
            );

            return;

        }


        const columnNumber =
            parseInt(
                document.getElementById(
                    "columnSelect"
                ).value
            );


        if (
            !columnNumber ||
            columnNumber < 1
        ) {

            alert(
                "Split column select karein."
            );

            return;

        }


        document.getElementById(
            "status"
        ).textContent =
            "DTR values read ho rahe hain...";


        const ns =
            "http://schemas.openxmlformats.org/spreadsheetml/2006/main";


        const sharedStrings =
            await readSharedStrings(
                originalZip
            );


        const sheetData =
            sheetXML.getElementsByTagNameNS(
                ns,
                "sheetData"
            )[0];


        const rows =
            Array.from(
                sheetData.getElementsByTagNameNS(
                    ns,
                    "row"
                )
            );


        /*
        First row = header
        */

        const groups =
            new Map();


        /*
        Read DTR from each row
        */

        for (
            let i = 1;
            i < rows.length;
            i++
        ) {

            const row =
                rows[i];


            const cells =
                row.getElementsByTagNameNS(
                    ns,
                    "c"
                );


            let dtrValue = "";


            for (const cell of cells) {

                const ref =
                    cell.getAttribute("r");


                const column =
                    getCellColumn(ref);


                if (
                    column ===
                    columnNumber
                ) {

                    dtrValue =
                        await getCellValue(
                            cell,
                            sharedStrings
                        );

                    break;

                }

            }


            dtrValue =
                cleanText(
                    dtrValue
                );


            if (!dtrValue) {

                dtrValue =
                    "Blank";

            }


            if (!groups.has(
                dtrValue
            )) {

                groups.set(
                    dtrValue,
                    []
                );

            }


            groups
                .get(dtrValue)
                .push(row);

        }


        document.getElementById(
            "fileCount"
        ).textContent =
            groups.size;


        /*
        ================================================
        CREATE ZIP
        ================================================
        */

        const zip =
            new JSZip();


        let counter = 0;


        for (
            const [
                dtr,
                matchingRows
            ]
            of groups
        ) {

            document.getElementById(
                "status"
            ).textContent =
                "Creating " +
                dtr +
                " ...";


            /*
            Clone original XLSX
            */

            const newZip =
                await JSZip.loadAsync(
                    await originalZip
                        .generateAsync({
                            type: "arraybuffer"
                        })
                );


            /*
            Get original sheet XML
            */

            const sheetFile =
                newZip.file(
                    selectedSheetPath
                );


            const sheetText =
                await sheetFile.async(
                    "text"
                );


            const newSheetXML =
                parseXML(
                    sheetText
                );


            const newSheetData =
                newSheetXML
                    .getElementsByTagNameNS(
                        ns,
                        "sheetData"
                    )[0];


            /*
            Remove all data rows
            but keep header row
            */

            const allRows =
                Array.from(
                    newSheetData
                        .getElementsByTagNameNS(
                            ns,
                            "row"
                        )
                );


            for (
                let i = 1;
                i < allRows.length;
                i++
            ) {

                newSheetData.removeChild(
                    allRows[i]
                );

            }


            /*
            Add matching original rows
            */

            let newRowNumber =
                2;


            for (
                const originalRow
                of matchingRows
            ) {

                const importedRow =
                    newSheetXML.importNode(
                        originalRow,
                        true
                    );


                /*
                IMPORTANT:
                Change row number
                */

                importedRow.setAttribute(
                    "r",
                    String(
                        newRowNumber
                    )
                );


                /*
                Change every cell reference
                */

                const rowCells =
                    importedRow
                        .getElementsByTagNameNS(
                            ns,
                            "c"
                        );


                for (
                    const cell
                    of rowCells
                ) {

                    const oldRef =
                        cell.getAttribute(
                            "r"
                        );


                    if (!oldRef) {
                        continue;
                    }


                    const columnMatch =
                        oldRef.match(
                            /^([A-Z]+)/
                        );


                    if (
                        columnMatch
                    ) {

                        cell.setAttribute(
                            "r",
                            columnMatch[1] +
                            newRowNumber
                        );

                    }

                }


                newSheetData.appendChild(
                    importedRow
                );


                newRowNumber++;

            }


            /*
            Update dimension
            */

            const dimension =
                newSheetXML
                    .getElementsByTagNameNS(
                        ns,
                        "dimension"
                    )[0];


            if (dimension) {

                const oldRef =
                    dimension.getAttribute(
                        "ref"
                    );


                if (oldRef) {

                    const start =
                        oldRef.split(":")[0];


                    const end =
                        oldRef.split(":")[1] ||
                        start;


                    const endColumn =
                        end.match(
                            /^[A-Z]+/
                        );


                    if (endColumn) {

                        dimension.setAttribute(
                            "ref",
                            start +
                            ":" +
                            endColumn[0] +
                            (
                                newRowNumber - 1
                            )
                        );

                    }

                }

            }


            /*
            Update AutoFilter
            */

            const autoFilter =
                newSheetXML
                    .getElementsByTagNameNS(
                        ns,
                        "autoFilter"
                    )[0];


            if (autoFilter) {

                const oldRef =
                    autoFilter.getAttribute(
                        "ref"
                    );


                if (oldRef) {

                    const parts =
                        oldRef.split(":");


                    if (
                        parts.length === 2
                    ) {

                        const endColumn =
                            parts[1].match(
                                /^[A-Z]+/
                            );


                        if (endColumn) {

                            autoFilter.setAttribute(
                                "ref",
                                parts[0] +
                                ":" +
                                endColumn[0] +
                                (
                                    newRowNumber - 1
                                )
                            );

                        }

                    }

                }

            }


            /*
            Replace sheet XML
            */

            newZip.file(
                selectedSheetPath,
                serializeXML(
                    newSheetXML
                )
            );


            /*
            Download only Sheet3:
            remove other worksheet
            entries from workbook.xml
            */

            const newWorkbookFile =
                newZip.file(
                    "xl/workbook.xml"
                );


            const newWorkbookText =
                await newWorkbookFile.async(
                    "text"
                );


            const newWorkbookXML =
                parseXML(
                    newWorkbookText
                );


            const workbookSheets =
                newWorkbookXML
                    .getElementsByTagNameNS(
                        ns,
                        "sheets"
                    )[0];


            const workbookSheetNodes =
                Array.from(
                    workbookSheets
                        .getElementsByTagNameNS(
                            ns,
                            "sheet"
                        )
                );


            for (
                const sheetNode
                of workbookSheetNodes
            ) {

                if (
                    sheetNode.getAttribute(
                        "name"
                    ) !==
                    selectedSheetName
                ) {

                    workbookSheets
                        .removeChild(
                            sheetNode
                        );

                }

            }


            newZip.file(
                "xl/workbook.xml",
                serializeXML(
                    newWorkbookXML
                )
            );


            /*
            Create XLSX
            */

            const output =
                await newZip.generateAsync({
                    type: "blob",
                    compression: "DEFLATE",
                    compressionOptions: {
                        level: 6
                    }
                });


            /*
            Safe filename
            */

            let filename =
                dtr
                    .replace(
                        /[\\\/:*?"<>|]/g,
                        "_"
                    )
                    .trim();


            if (!filename) {
                filename = "Blank";
            }


            zip.file(
                filename +
                ".xlsx",
                output
            );


            counter++;


            document.getElementById(
                "status"
            ).textContent =
                "Completed " +
                counter +
                " / " +
                groups.size;


            /*
            Browser ko time
            */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        0
                    )
            );

        }


        /*
        ================================================
        FINAL ZIP
        ================================================
        */

        document.getElementById(
            "status"
        ).textContent =
            "Final ZIP ban raha hai...";


        generatedZIP =
            await zip.generateAsync({
                type: "blob",
                compression: "DEFLATE",
                compressionOptions: {
                    level: 6
                }
            });


        document.getElementById(
            "downloadBtn"
        ).style.display =
            "inline-block";


        document.getElementById(
            "status"
        ).textContent =
            "Done! " +
            groups.size +
            " DTR files ready.";

    }
);


/*
=========================================================
DOWNLOAD
=========================================================
*/

document
.getElementById("downloadBtn")
.addEventListener(
    "click",
    function() {

        if (!generatedZIP) {

            alert(
                "Pehle Split Excel karein."
            );

            return;

        }


        const url =
            URL.createObjectURL(
                generatedZIP
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "DTR_Split_Files.zip";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            function() {

                URL.revokeObjectURL(
                    url
                );

            },
            2000
        );

    }
);

</script>

</body>
</html>
