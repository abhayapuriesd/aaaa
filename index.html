<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Excel Splitter</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

h1 {
    margin-top: 0;
}

.upload-box {
    border: 2px dashed #999;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    margin: 20px 0;
}

select,
input[type="file"] {
    padding: 10px;
    margin: 8px;
    font-size: 15px;
}

button {
    padding: 12px 22px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
    margin: 8px;
}

#splitBtn {
    background: #1976d2;
    color: white;
}

#downloadBtn {
    background: #2e7d32;
    color: white;
    display: none;
}

#status {
    margin-top: 20px;
    font-weight: bold;
}

.info {
    background: #f1f3f4;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
}

</style>

</head>


<body>

<div class="container">

<h1>Excel Splitter</h1>


<div class="upload-box">

    <input
        type="file"
        id="fileInput"
        accept=".xls,.xlsx"
    >

    <br>


    <label>
        <b>Sheet:</b>
    </label>


    <select id="sheetSelect" disabled>

        <option>
            Select Excel first
        </option>

    </select>


    <br>


    <label>
        <b>Split By Column:</b>
    </label>


    <select id="columnSelect" disabled>

        <option>
            Select Sheet first
        </option>

    </select>


    <br>


    <button id="splitBtn">

        Split Excel

    </button>


    <button id="downloadBtn">

        Download ZIP

    </button>

</div>


<div class="info">

    <div>

        <b>File:</b>

        <span id="fileName">
            -
        </span>

    </div>


    <div>

        <b>Total Rows:</b>

        <span id="rowCount">
            -
        </span>

    </div>


    <div>

        <b>Number of Files:</b>

        <span id="fileCount">
            -
        </span>

    </div>

</div>


<div id="status"></div>

</div>


<script>


let workbook = null;

let currentSheetName = "";

let currentWorksheet = null;

let currentRows = [];

let headers = [];

let zipFile = null;



/* =====================================================
   FILE UPLOAD
===================================================== */


document
.getElementById("fileInput")
.addEventListener(
    "change",
    async function(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        document.getElementById("fileName")
            .textContent =
            file.name;


        document.getElementById("status")
            .textContent =
            "Excel read ho raha hai...";


        try {

            const buffer =
                await file.arrayBuffer();


            workbook =
                XLSX.read(
                    buffer,
                    {
                        type: "array",

                        cellStyles: true,

                        cellNF: true,

                        cellHTML: true
                    }
                );


            const sheetSelect =
                document.getElementById(
                    "sheetSelect"
                );


            sheetSelect.innerHTML =
                "";


            workbook.SheetNames.forEach(
                function(sheetName) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        sheetName;


                    option.textContent =
                        sheetName;


                    sheetSelect.appendChild(
                        option
                    );

                }
            );


            sheetSelect.disabled =
                false;


            loadSheet(
                workbook.SheetNames[0]
            );


            document.getElementById(
                "status"
            ).textContent =
                "Excel loaded successfully.";

        }

        catch(error) {

            console.error(error);

            document.getElementById(
                "status"
            ).textContent =
                "Excel read nahi ho paya.";

            alert(
                error.message
            );

        }

    }
);



/* =====================================================
   LOAD SHEET
===================================================== */


document
.getElementById("sheetSelect")
.addEventListener(
    "change",
    function() {

        loadSheet(
            this.value
        );

    }
);



function loadSheet(sheetName) {

    currentSheetName =
        sheetName;


    currentWorksheet =
        workbook.Sheets[
            sheetName
        ];


    if (!currentWorksheet) {
        return;
    }


    currentRows =
        XLSX.utils.sheet_to_json(
            currentWorksheet,
            {
                header: 1,
                defval: "",
                raw: false
            }
        );


    if (
        !currentRows ||
        currentRows.length === 0
    ) {

        document.getElementById(
            "columnSelect"
        ).disabled = true;

        return;
    }


    headers =
        currentRows[0];


    const columnSelect =
        document.getElementById(
            "columnSelect"
        );


    columnSelect.innerHTML =
        "";


    headers.forEach(
        function(header, index) {

            let name =
                String(header).trim();


            if (!name) {

                name =
                    "Column " +
                    (index + 1);

            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                index;


            option.textContent =
                name;


            columnSelect.appendChild(
                option
            );

        }
    );


    columnSelect.disabled =
        false;


    document.getElementById(
        "rowCount"
    ).textContent =
        Math.max(
            currentRows.length - 1,
            0
        );

}



/* =====================================================
   COPY COLUMN WIDTHS
===================================================== */


function copyColumnWidths(
    sourceSheet,
    targetSheet
) {

    if (!sourceSheet["!cols"]) {
        return;
    }


    targetSheet["!cols"] =
        JSON.parse(
            JSON.stringify(
                sourceSheet["!cols"]
            )
        );

}



/* =====================================================
   COPY ROW HEIGHTS
===================================================== */


function copyRowHeights(
    sourceSheet,
    targetSheet,
    sourceRows
) {

    if (!sourceSheet["!rows"]) {
        return;
    }


    targetSheet["!rows"] =
        [];


    for (
        let i = 0;
        i < sourceRows.length;
        i++
    ) {

        if (
            sourceSheet["!rows"][i]
        ) {

            targetSheet["!rows"][i] =
                JSON.parse(
                    JSON.stringify(
                        sourceSheet["!rows"][i]
                    )
                );

        }

    }

}



/* =====================================================
   COPY CELL STYLE
===================================================== */


function copyCellStyle(
    sourceCell,
    targetCell
) {

    if (!sourceCell) {
        return;
    }


    /*
       Value
    */

    if (
        sourceCell.v !== undefined
    ) {

        targetCell.v =
            sourceCell.v;

    }


    /*
       Formula
    */

    if (
        sourceCell.f !== undefined
    ) {

        targetCell.f =
            sourceCell.f;

    }


    /*
       Type
    */

    if (
        sourceCell.t !== undefined
    ) {

        targetCell.t =
            sourceCell.t;

    }


    /*
       Number Format
    */

    if (
        sourceCell.z !== undefined
    ) {

        targetCell.z =
            sourceCell.z;

    }


    /*
       Style
    */

    if (
        sourceCell.s !== undefined
    ) {

        targetCell.s =
            JSON.parse(
                JSON.stringify(
                    sourceCell.s
                )
            );

    }


    /*
       Hyperlink
    */

    if (
        sourceCell.l !== undefined
    ) {

        targetCell.l =
            JSON.parse(
                JSON.stringify(
                    sourceCell.l
                )
            );

    }


    /*
       Comment
    */

    if (
        sourceCell.c !== undefined
    ) {

        targetCell.c =
            JSON.parse(
                JSON.stringify(
                    sourceCell.c
                )
            );

    }

}



/* =====================================================
   COPY ORIGINAL ROW
===================================================== */


function copyOriginalRow(
    sourceSheet,
    targetSheet,
    sourceRowNumber,
    targetRowNumber
) {

    const range =
        sourceSheet["!ref"];


    if (!range) {
        return;
    }


    const decoded =
        XLSX.utils.decode_range(
            range
        );


    for (
        let col = decoded.s.c;
        col <= decoded.e.c;
        col++
    ) {

        const sourceAddress =
            XLSX.utils.encode_cell({
                r: sourceRowNumber,
                c: col
            });


        const targetAddress =
            XLSX.utils.encode_cell({
                r: targetRowNumber,
                c: col
            });


        const sourceCell =
            sourceSheet[
                sourceAddress
            ];


        if (!sourceCell) {
            continue;
        }


        const targetCell =
            {};


        copyCellStyle(
            sourceCell,
            targetCell
        );


        targetSheet[
            targetAddress
        ] =
            targetCell;

    }

}



/* =====================================================
   SPLIT EXCEL
===================================================== */


document
.getElementById("splitBtn")
.addEventListener(
    "click",
    async function() {

        if (!workbook) {

            alert(
                "Pehle Excel file select karein."
            );

            return;
        }


        const columnIndex =
            parseInt(
                document.getElementById(
                    "columnSelect"
                ).value
            );


        const sourceSheet =
            currentWorksheet;


        const range =
            sourceSheet["!ref"];


        if (!range) {

            alert(
                "Selected sheet mein data nahi hai."
            );

            return;
        }


        const decodedRange =
            XLSX.utils.decode_range(
                range
            );


        /*
           Unique groups
        */

        const groups =
            new Map();


        /*
           Header row = row 0
        */

        for (
            let rowIndex = 1;
            rowIndex < currentRows.length;
            rowIndex++
        ) {

            const row =
                currentRows[rowIndex];


            let value =
                row[columnIndex];


            if (
                value === undefined ||
                value === null ||
                String(value).trim() === ""
            ) {

                value =
                    "Blank";

            }


            value =
                String(value).trim();


            if (!groups.has(value)) {

                groups.set(
                    value,
                    []
                );

            }


            groups
                .get(value)
                .push(rowIndex);

        }


        if (groups.size === 0) {

            alert(
                "Split karne ke liye data nahi mila."
            );

            return;
        }


        document.getElementById(
            "fileCount"
        ).textContent =
            groups.size;


        const zip =
            new JSZip();


        let counter = 0;


        /*
           Har unique value ke liye
           ek Excel file
        */

        for (
            const [
                groupValue,
                rowIndexes
            ]
            of groups
        ) {

            /*
               New worksheet
            */

            const targetSheet =
                {};


            /*
               Header + matching rows
            */

            const outputRows = [
                0,
                ...rowIndexes
            ];


            /*
               Original cells copy
            */

            outputRows.forEach(
                function(
                    sourceRow,
                    targetRow
                ) {

                    copyOriginalRow(
                        sourceSheet,
                        targetSheet,
                        sourceRow,
                        targetRow
                    );

                }
            );


            /*
               Range
            */

            targetSheet["!ref"] =
                XLSX.utils.encode_range({

                    s: {
                        r: 0,
                        c: decodedRange.s.c
                    },

                    e: {
                        r:
                            outputRows.length - 1,

                        c:
                            decodedRange.e.c
                    }

                });


            /*
               Column Width copy
            */

            copyColumnWidths(
                sourceSheet,
                targetSheet
            );


            /*
               Row Height copy
            */

            copyRowHeights(
                sourceSheet,
                targetSheet,
                outputRows
            );


            /*
               Merged cells
               Header merge preserve
            */

            if (
                sourceSheet["!merges"]
            ) {

                targetSheet["!merges"] =
                    [];


                sourceSheet["!merges"]
                    .forEach(
                        function(merge) {

                            /*
                               Sirf wahi merges
                               preserve karein jo
                               header row mein hain
                            */

                            if (
                                merge.s.r === 0
                            ) {

                                const newMerge =
                                    JSON.parse(
                                        JSON.stringify(
                                            merge
                                        )
                                    );


                                targetSheet[
                                    "!merges"
                                ].push(
                                    newMerge
                                );

                            }

                        }
                    );

            }


            /*
               New workbook
            */

            const newWorkbook =
                XLSX.utils.book_new();


            XLSX.utils.book_append_sheet(
                newWorkbook,
                targetSheet,
                "Sheet1"
            );


            /*
               Excel file
            */

            const excelBuffer =
                XLSX.write(
                    newWorkbook,
                    {
                        bookType: "xlsx",
                        type: "array",
                        cellStyles: true
                    }
                );


            /*
               Safe filename
            */

            let safeName =
                String(groupValue)
                    .replace(
                        /[\\\/:*?"<>|]/g,
                        "_"
                    )
                    .trim();


            if (!safeName) {

                safeName =
                    "Blank";

            }


            zip.file(
                safeName + ".xlsx",
                excelBuffer
            );


            counter++;


            document.getElementById(
                "status"
            ).textContent =
                "Processing " +
                counter +
                " / " +
                groups.size +
                "...";


            /*
               Browser responsive
            */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        0
                    )
            );

        }


        /*
           ZIP create
        */

        zipFile =
            await zip.generateAsync(
                {
                    type: "blob"
                },

                function(metadata) {

                    document.getElementById(
                        "status"
                    ).textContent =
                        "ZIP preparing: " +
                        Math.round(
                            metadata.percent
                        ) +
                        "%";

                }
            );


        document.getElementById(
            "downloadBtn"
        ).style.display =
            "inline-block";


        document.getElementById(
            "status"
        ).textContent =
            "Completed! " +
            groups.size +
            " files ready.";

    }
);



/* =====================================================
   DOWNLOAD ZIP
===================================================== */


document
.getElementById("downloadBtn")
.addEventListener(
    "click",
    function() {

        if (!zipFile) {

            alert(
                "Pehle Excel split karein."
            );

            return;
        }


        const url =
            URL.createObjectURL(
                zipFile
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "Split_Excel_Files.zip";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            function() {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );

    }
);


</script>

</body>
</html>
