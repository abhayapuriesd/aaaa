<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Excel Splitter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

h1 {
    margin-top: 0;
    color: #222;
}

.upload-box {
    border: 2px dashed #999;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    margin: 20px 0;
}

input[type="file"] {
    margin: 15px;
}

select {
    padding: 10px;
    margin: 10px;
    min-width: 260px;
    font-size: 15px;
}

button {
    padding: 12px 22px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
    margin: 8px;
}

#splitBtn {
    background: #1976d2;
    color: white;
}

#downloadBtn {
    background: #2e7d32;
    color: white;
    display: none;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.info {
    background: #f1f3f4;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
}

.info div {
    margin: 6px 0;
}

#status {
    margin-top: 20px;
    font-weight: bold;
    line-height: 1.5;
}

</style>

</head>


<body>


<div class="container">

<h1>Excel Splitter</h1>


<div class="upload-box">

    <input
        type="file"
        id="fileInput"
        accept=".xlsx"
    >

    <br>


    <label>
        <b>Sheet:</b>
    </label>

    <select
        id="sheetSelect"
        disabled
    >

        <option>
            Select Excel first
        </option>

    </select>


    <br>


    <label>
        <b>Split By:</b>
    </label>

    <select
        id="columnSelect"
        disabled
    >

        <option>
            Select Sheet first
        </option>

    </select>


    <br>


    <button
        id="splitBtn"
        disabled
    >
        Split Excel
    </button>


    <button
        id="downloadBtn"
    >
        Download ZIP
    </button>

</div>


<div class="info">

    <div>
        <b>File:</b>
        <span id="fileName">-</span>
    </div>

    <div>
        <b>Sheet:</b>
        <span id="selectedSheet">-</span>
    </div>

    <div>
        <b>Total Rows:</b>
        <span id="rowCount">-</span>
    </div>

    <div>
        <b>DTR Files:</b>
        <span id="fileCount">-</span>
    </div>

</div>


<div id="status"></div>


</div>


<script>


/*
=========================================================
GLOBAL VARIABLES
=========================================================
*/

let originalZip = null;

let selectedSheetName = "";

let selectedSheetPath = "";

let generatedZIP = null;


/*
=========================================================
NAMESPACE
=========================================================
*/

const MAIN_NS =
    "http://schemas.openxmlformats.org/spreadsheetml/2006/main";


/*
=========================================================
PARSE XML
=========================================================
*/

function parseXML(text) {

    return new DOMParser()
        .parseFromString(
            text,
            "application/xml"
        );

}


/*
=========================================================
SERIALIZE XML
=========================================================
*/

function serializeXML(xml) {

    return new XMLSerializer()
        .serializeToString(xml);

}


/*
=========================================================
CLEAN TEXT
=========================================================
*/

function cleanText(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value).trim();

}


/*
=========================================================
COLUMN LETTER → NUMBER

A = 1
B = 2
Z = 26
AA = 27
=========================================================
*/

function columnLetterToNumber(
    letters
) {

    let number = 0;


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        number =
            number * 26 +
            (
                letters.charCodeAt(i) -
                64
            );

    }


    return number;

}


/*
=========================================================
CELL REFERENCE → COLUMN NUMBER

A1 → 1
L5 → 12
AA20 → 27
=========================================================
*/

function getCellColumn(
    reference
) {

    if (!reference) {

        return null;

    }


    const match =
        reference.match(
            /^([A-Z]+)/
        );


    if (!match) {

        return null;

    }


    return columnLetterToNumber(
        match[1]
    );

}


/*
=========================================================
READ SHARED STRINGS
=========================================================
*/

async function readSharedStrings(
    zip
) {

    const file =
        zip.file(
            "xl/sharedStrings.xml"
        );


    if (!file) {

        return [];

    }


    const text =
        await file.async(
            "text"
        );


    const xml =
        parseXML(text);


    const nodes =
        Array.from(
            xml.getElementsByTagNameNS(
                MAIN_NS,
                "si"
            )
        );


    const result = [];


    for (
        const si
        of nodes
    ) {

        const textNodes =
            Array.from(
                si.getElementsByTagNameNS(
                    MAIN_NS,
                    "t"
                )
            );


        let value = "";


        for (
            const t
            of textNodes
        ) {

            value +=
                t.textContent;

        }


        result.push(
            value
        );

    }


    return result;

}


/*
=========================================================
GET CELL VALUE
=========================================================
*/

async function getCellValue(
    cell,
    sharedStrings
) {

    if (!cell) {

        return "";

    }


    const type =
        cell.getAttribute("t");


    /*
    INLINE STRING
    */

    if (
        type ===
        "inlineStr"
    ) {

        const textNodes =
            Array.from(
                cell.getElementsByTagNameNS(
                    MAIN_NS,
                    "t"
                )
            );


        let value = "";


        for (
            const node
            of textNodes
        ) {

            value +=
                node.textContent;

        }


        return cleanText(
            value
        );

    }


    /*
    NORMAL VALUE
    */

    const valueNode =
        cell.getElementsByTagNameNS(
            MAIN_NS,
            "v"
        )[0];


    if (!valueNode) {

        return "";

    }


    let value =
        valueNode.textContent;


    /*
    SHARED STRING
    */

    if (
        type === "s"
    ) {

        const index =
            parseInt(
                value,
                10
            );


        if (
            !isNaN(index) &&
            sharedStrings[index] !== undefined
        ) {

            value =
                sharedStrings[index];

        }

    }


    return cleanText(
        value
    );

}


/*
=========================================================
GET WORKBOOK SHEETS

IMPORTANT:
sheets ko Array mein convert kiya gaya hai.
Isse .find() error nahi aayega.
=========================================================
*/

async function getWorkbookSheets(
    zip
) {

    const workbookFile =
        zip.file(
            "xl/workbook.xml"
        );


    if (!workbookFile) {

        throw new Error(
            "workbook.xml nahi mila."
        );

    }


    const text =
        await workbookFile.async(
            "text"
        );


    const xml =
        parseXML(text);


    const sheets =
        Array.from(
            xml.getElementsByTagNameNS(
                MAIN_NS,
                "sheet"
            )
        );


    const result = [];


    for (
        const sheet
        of sheets
    ) {

        result.push({

            name:
                sheet.getAttribute(
                    "name"
                ),

            rid:
                sheet.getAttribute(
                    "r:id"
                )

        });

    }


    return {

        xml: xml,

        sheets: result

    };

}


/*
=========================================================
FIND SHEET PATH
=========================================================
*/

async function findSheetPath(
    zip,
    relationshipId
) {

    const relFile =
        zip.file(
            "xl/_rels/workbook.xml.rels"
        );


    if (!relFile) {

        throw new Error(
            "workbook.xml.rels nahi mila."
        );

    }


    const text =
        await relFile.async(
            "text"
        );


    const xml =
        parseXML(text);


    const relationships =
        Array.from(
            xml.getElementsByTagName(
                "Relationship"
            )
        );


    for (
        const rel
        of relationships
    ) {

        if (
            rel.getAttribute("Id") ===
            relationshipId
        ) {

            let target =
                rel.getAttribute(
                    "Target"
                );


            if (!target) {

                return null;

            }


            /*
            Normalize path
            */

            target =
                target.replace(
                    /^\/+/,
                    ""
                );


            if (
                !target.startsWith(
                    "xl/"
                )
            ) {

                target =
                    "xl/" + target;

            }


            return target;

        }

    }


    return null;

}


/*
=========================================================
FILE UPLOAD
=========================================================
*/

document
.getElementById("fileInput")
.addEventListener(
    "change",
    async function(event) {

        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        try {

            document.getElementById(
                "status"
            ).textContent =
                "Excel read ho raha hai...";


            /*
            Read file
            */

            const buffer =
                await file.arrayBuffer();


            /*
            Load XLSX as ZIP
            */

            originalZip =
                await JSZip.loadAsync(
                    buffer
                );


            /*
            Workbook sheets
            */

            const workbookData =
                await getWorkbookSheets(
                    originalZip
                );


            /*
            Sheet dropdown
            */

            const sheetSelect =
                document.getElementById(
                    "sheetSelect"
                );


            sheetSelect.innerHTML =
                "";


            for (
                const sheet
                of workbookData.sheets
            ) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    sheet.name;


                option.textContent =
                    sheet.name;


                sheetSelect.appendChild(
                    option
                );

            }


            sheetSelect.disabled =
                false;


            /*
            Automatically select Sheet3
            */

            let defaultSheet =
                workbookData.sheets.find(
                    function(sheet) {

                        return (
                            sheet.name
                                .toLowerCase() ===
                            "sheet3"
                        );

                    }
                );


            /*
            If Sheet3 doesn't exist,
            first sheet
            */

            if (!defaultSheet) {

                defaultSheet =
                    workbookData.sheets[0];

            }


            if (!defaultSheet) {

                throw new Error(
                    "Excel mein koi sheet nahi mili."
                );

            }


            sheetSelect.value =
                defaultSheet.name;


            /*
            Load Sheet3
            */

            await loadSelectedSheet(
                defaultSheet.name
            );


            document.getElementById(
                "fileName"
            ).textContent =
                file.name;


            document.getElementById(
                "status"
            ).textContent =
                "Excel successfully loaded.";

        }

        catch(error) {

            console.error(error);


            document.getElementById(
                "status"
            ).textContent =
                "Error.";


            alert(
                "Excel read nahi ho paya:\n\n" +
                error.message
            );

        }

    }
);


/*
=========================================================
SHEET CHANGE
=========================================================
*/

document
.getElementById("sheetSelect")
.addEventListener(
    "change",
    async function() {

        try {

            await loadSelectedSheet(
                this.value
            );

        }

        catch(error) {

            console.error(error);

            alert(
                error.message
            );

        }

    }
);


/*
=========================================================
LOAD SELECTED SHEET
=========================================================
*/

async function loadSelectedSheet(
    sheetName
) {

    selectedSheetName =
        sheetName;


    /*
    Get workbook sheets
    */

    const workbookData =
        await getWorkbookSheets(
            originalZip
        );


    /*
    Find selected sheet
    */

    const sheet =
        workbookData.sheets.find(
            function(item) {

                return (
                    item.name ===
                    sheetName
                );

            }
        );


    if (!sheet) {

        throw new Error(
            "Sheet nahi mili: " +
            sheetName
        );

    }


    /*
    Find XML path
    */

    selectedSheetPath =
        await findSheetPath(
            originalZip,
            sheet.rid
        );


    if (!selectedSheetPath) {

        throw new Error(
            "Selected sheet ka XML nahi mila."
        );

    }


    /*
    Read sheet XML
    */

    const sheetFile =
        originalZip.file(
            selectedSheetPath
        );


    if (!sheetFile) {

        throw new Error(
            "Sheet file nahi mili:\n" +
            selectedSheetPath
        );

    }


    const text =
        await sheetFile.async(
            "text"
        );


    const sheetXML =
        parseXML(text);


    /*
    Shared strings
    */

    const sharedStrings =
        await readSharedStrings(
            originalZip
        );


    /*
    Sheet data
    */

    const sheetData =
        sheetXML.getElementsByTagNameNS(
            MAIN_NS,
            "sheetData"
        )[0];


    if (!sheetData) {

        throw new Error(
            "Sheet data nahi mila."
        );

    }


    /*
    Rows
    */

    const rows =
        Array.from(
            sheetData.getElementsByTagNameNS(
                MAIN_NS,
                "row"
            )
        );


    if (!rows.length) {

        throw new Error(
            "Sheet mein rows nahi hain."
        );

    }


    /*
    Header row
    */

    const headerRow =
        rows[0];


    const headerCells =
        Array.from(
            headerRow.getElementsByTagNameNS(
                MAIN_NS,
                "c"
            )
        );


    const columnSelect =
        document.getElementById(
            "columnSelect"
        );


    columnSelect.innerHTML =
        "";


    /*
    Header columns
    */

    for (
        const cell
        of headerCells
    ) {

        const reference =
            cell.getAttribute(
                "r"
            );


        const column =
            getCellColumn(
                reference
            );


        if (!column) {

            continue;

        }


        const value =
            await getCellValue(
                cell,
                sharedStrings
            );


        const option =
            document.createElement(
                "option"
            );


        option.value =
            column;


        option.textContent =
            value ||
            "Column " + column;


        columnSelect.appendChild(
            option
        );

    }


    /*
    Find DTR No.
    */

    let dtrFound =
        false;


    for (
        const option
        of columnSelect.options
    ) {

        const normalized =
            option.textContent
                .toLowerCase()
                .replace(
                    /[\s._-]/g,
                    ""
                );


        if (
            normalized === "dtrno" ||
            normalized.includes("dtrno")
        ) {

            columnSelect.value =
                option.value;


            dtrFound =
                true;


            break;

        }

    }


    /*
    Your Sheet3:
    DTR No. = Column L = 12
    */

    if (!dtrFound) {

        columnSelect.value =
            "12";

    }


    columnSelect.disabled =
        false;


    document.getElementById(
        "splitBtn"
    ).disabled =
        false;


    document.getElementById(
        "selectedSheet"
    ).textContent =
        sheetName;


    document.getElementById(
        "rowCount"
    ).textContent =
        Math.max(
            rows.length - 1,
            0
        );

}


/*
=========================================================
SAFE FILE NAME
=========================================================
*/

function safeFileName(
    value
) {

    let name =
        String(value)
            .replace(
                /[\\\/:*?"<>|]/g,
                "_"
            )
            .trim();


    if (!name) {

        name =
            "Blank";

    }


    return name;

}


/*
=========================================================
SPLIT EXCEL
=========================================================
*/

document
.getElementById("splitBtn")
.addEventListener(
    "click",
    async function() {

        if (!originalZip) {

            alert(
                "Pehle Excel upload karein."
            );

            return;

        }


        const columnNumber =
            parseInt(
                document.getElementById(
                    "columnSelect"
                ).value
            );


        if (
            !columnNumber ||
            columnNumber < 1
        ) {

            alert(
                "Split column select karein."
            );

            return;

        }


        try {

            document.getElementById(
                "status"
            ).textContent =
                "DTR data read ho raha hai...";


            /*
            Read original sheet
            */

            const sheetFile =
                originalZip.file(
                    selectedSheetPath
                );


            const sheetText =
                await sheetFile.async(
                    "text"
                );


            const originalSheetXML =
                parseXML(
                    sheetText
                );


            const sheetData =
                originalSheetXML
                    .getElementsByTagNameNS(
                        MAIN_NS,
                        "sheetData"
                    )[0];


            const rows =
                Array.from(
                    sheetData
                        .getElementsByTagNameNS(
                            MAIN_NS,
                            "row"
                        )
                );


            const sharedStrings =
                await readSharedStrings(
                    originalZip
                );


            /*
            =========================================
            GROUP ROWS BY DTR
            =========================================
            */

            const groups =
                new Map();


            for (
                let i = 1;
                i < rows.length;
                i++
            ) {

                const row =
                    rows[i];


                const cells =
                    Array.from(
                        row.getElementsByTagNameNS(
                            MAIN_NS,
                            "c"
                        )
                    );


                let dtr =
                    "";


                for (
                    const cell
                    of cells
                ) {

                    const reference =
                        cell.getAttribute(
                            "r"
                        );


                    const column =
                        getCellColumn(
                            reference
                        );


                    if (
                        column ===
                        columnNumber
                    ) {

                        dtr =
                            await getCellValue(
                                cell,
                                sharedStrings
                            );

                        break;

                    }

                }


                dtr =
                    cleanText(dtr);


                if (!dtr) {

                    dtr =
                        "Blank";

                }


                if (!groups.has(dtr)) {

                    groups.set(
                        dtr,
                        []
                    );

                }


                groups
                    .get(dtr)
                    .push(row);

            }


            /*
            No groups
            */

            if (
                groups.size === 0
            ) {

                alert(
                    "DTR data nahi mila."
                );

                return;

            }


            document.getElementById(
                "fileCount"
            ).textContent =
                groups.size;


            /*
            =========================================
            CREATE ZIP
            =========================================
            */

            const outputZIP =
                new JSZip();


            let counter =
                0;


            /*
            =========================================
            PROCESS EACH DTR
            =========================================
            */

            for (
                const [
                    dtr,
                    matchingRows
                ]
                of groups
            ) {

                counter++;


                document.getElementById(
                    "status"
                ).textContent =
                    "Processing " +
                    counter +
                    " / " +
                    groups.size +
                    " : DTR " +
                    dtr;


                /*
                Clone ORIGINAL XLSX
                */

                const newZip =
                    await JSZip.loadAsync(
                        await originalZip
                            .generateAsync({
                                type:
                                    "arraybuffer"
                            })
                    );


                /*
                Read cloned sheet
                */

                const clonedSheetFile =
                    newZip.file(
                        selectedSheetPath
                    );


                const clonedSheetText =
                    await clonedSheetFile
                        .async("text");


                const newSheetXML =
                    parseXML(
                        clonedSheetText
                    );


                const newSheetData =
                    newSheetXML
                        .getElementsByTagNameNS(
                            MAIN_NS,
                            "sheetData"
                        )[0];


                /*
                Existing rows
                */

                const existingRows =
                    Array.from(
                        newSheetData
                            .getElementsByTagNameNS(
                                MAIN_NS,
                                "row"
                            )
                    );


                /*
                Keep ONLY header row
                */

                for (
                    let i = 1;
                    i < existingRows.length;
                    i++
                ) {

                    newSheetData
                        .removeChild(
                            existingRows[i]
                        );

                }


                /*
                =====================================
                ADD ORIGINAL MATCHING ROWS
                =====================================
                */

                let newRowNumber =
                    2;


                for (
                    const sourceRow
                    of matchingRows
                ) {

                    /*
                    Clone complete row

                    IMPORTANT:
                    This keeps the original
                    style attributes,
                    including border.
                    */

                    const newRow =
                        sourceRow.cloneNode(
                            true
                        );


                    /*
                    Change row number
                    */

                    newRow.setAttribute(
                        "r",
                        String(
                            newRowNumber
                        )
                    );


                    /*
                    Change cell references
                    */

                    const rowCells =
                        Array.from(
                            newRow
                                .getElementsByTagNameNS(
                                    MAIN_NS,
                                    "c"
                                )
                        );


                    for (
                        const cell
                        of rowCells
                    ) {

                        const oldReference =
                            cell.getAttribute(
                                "r"
                            );


                        if (
                            !oldReference
                        ) {

                            continue;

                        }


                        const columnMatch =
                            oldReference.match(
                                /^([A-Z]+)/
                            );


                        if (
                            columnMatch
                        ) {

                            cell.setAttribute(
                                "r",
                                columnMatch[1] +
                                newRowNumber
                            );

                        }

                    }


                    /*
                    Add original row
                    */

                    newSheetData.appendChild(
                        newRow
                    );


                    newRowNumber++;

                }


                /*
                =====================================
                UPDATE DIMENSION
                =====================================
                */

                const dimension =
                    newSheetXML
                        .getElementsByTagNameNS(
                            MAIN_NS,
                            "dimension"
                        )[0];


                if (dimension) {

                    const currentRef =
                        dimension.getAttribute(
                            "ref"
                        );


                    if (currentRef) {

                        const parts =
                            currentRef.split(":");


                        let start =
                            parts[0];


                        let end =
                            parts[1] ||
                            parts[0];


                        const endColumnMatch =
                            end.match(
                                /^([A-Z]+)/
                            );


                        if (
                            endColumnMatch
                        ) {

                            dimension.setAttribute(
                                "ref",
                                start +
                                ":" +
                                endColumnMatch[1] +
                                (
                                    newRowNumber - 1
                                )
                            );

                        }

                    }

                }


                /*
                =====================================
                UPDATE AUTO FILTER
                =====================================
                */

                const autoFilter =
                    newSheetXML
                        .getElementsByTagNameNS(
                            MAIN_NS,
                            "autoFilter"
                        )[0];


                if (autoFilter) {

                    const filterRef =
                        autoFilter.getAttribute(
                            "ref"
                        );


                    if (filterRef) {

                        const parts =
                            filterRef.split(":");


                        if (
                            parts.length === 2
                        ) {

                            const endColumn =
                                parts[1].match(
                                    /^([A-Z]+)/
                                );


                            if (
                                endColumn
                            ) {

                                autoFilter.setAttribute(
                                    "ref",
                                    parts[0] +
                                    ":" +
                                    endColumn[1] +
                                    (
                                        newRowNumber - 1
                                    )
                                );

                            }

                        }

                    }

                }


                /*
                =====================================
                WRITE UPDATED SHEET
                =====================================
                */

                newZip.file(
                    selectedSheetPath,
                    serializeXML(
                        newSheetXML
                    )
                );


                /*
                =====================================
                CREATE XLSX
                =====================================
                */

                const xlsxBlob =
                    await newZip.generateAsync({
                        type: "blob",
                        compression: "DEFLATE",
                        compressionOptions: {
                            level: 6
                        }
                    });


                /*
                =====================================
                FILE NAME
                =====================================
                */

                const filename =
                    safeFileName(
                        dtr
                    ) +
                    ".xlsx";


                outputZIP.file(
                    filename,
                    xlsxBlob
                );


                /*
                Allow browser to breathe
                */

                await new Promise(
                    function(resolve) {

                        setTimeout(
                            resolve,
                            0
                        );

                    }
                );

            }


            /*
            =========================================
            CREATE FINAL ZIP
            =========================================
            */

            document.getElementById(
                "status"
            ).textContent =
                "Final ZIP ban raha hai...";


            generatedZIP =
                await outputZIP
                    .generateAsync({
                        type: "blob",
                        compression: "DEFLATE",
                        compressionOptions: {
                            level: 6
                        }
                    });


            /*
            Show download
            */

            document.getElementById(
                "downloadBtn"
            ).style.display =
                "inline-block";


            document.getElementById(
                "status"
            ).textContent =
                "✅ Complete! " +
                groups.size +
                " DTR files ready.";

        }

        catch(error) {

            console.error(error);


            document.getElementById(
                "status"
            ).textContent =
                "Error.";


            alert(
                "Split karte waqt error aaya:\n\n" +
                error.message
            );

        }

    }
);


/*
=========================================================
DOWNLOAD ZIP
=========================================================
*/

document
.getElementById("downloadBtn")
.addEventListener(
    "click",
    function() {

        if (!generatedZIP) {

            alert(
                "Pehle Excel split karein."
            );

            return;

        }


        const url =
            URL.createObjectURL(
                generatedZIP
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "DTR_Split_Files.zip";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            function() {

                URL.revokeObjectURL(
                    url
                );

            },
            2000
        );

    }
);

</script>

</body>

</html>
