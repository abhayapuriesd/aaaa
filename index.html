<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Excel Splitter</title>

<!-- ExcelJS -->
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<!-- JSZip -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

h1 {
    margin-top: 0;
    color: #222;
}

.upload-box {
    border: 2px dashed #999;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
    margin: 20px 0;
}

input[type="file"],
select {
    padding: 10px;
    margin: 8px;
    font-size: 15px;
    max-width: 90%;
}

button {
    padding: 12px 22px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
    margin: 8px;
}

#splitBtn {
    background: #1976d2;
    color: white;
}

#downloadBtn {
    background: #2e7d32;
    color: white;
    display: none;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#status {
    margin-top: 20px;
    font-weight: bold;
}

.info {
    background: #f1f3f4;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
}

.info div {
    margin: 5px 0;
}

</style>
</head>


<body>

<div class="container">

    <h1>Excel Splitter</h1>

    <div class="upload-box">

        <input
            type="file"
            id="fileInput"
            accept=".xlsx,.xls"
        >

        <br>

        <label>
            <b>Sheet:</b>
        </label>

        <select
            id="sheetSelect"
            disabled
        >
            <option>Select Excel first</option>
        </select>

        <br>

        <label>
            <b>Split By Column:</b>
        </label>

        <select
            id="columnSelect"
            disabled
        >
            <option>Select Sheet first</option>
        </select>

        <br>

        <button
            id="splitBtn"
            disabled
        >
            Split Excel
        </button>

        <button
            id="downloadBtn"
        >
            Download ZIP
        </button>

    </div>


    <div class="info">

        <div>
            <b>File:</b>
            <span id="fileName">-</span>
        </div>

        <div>
            <b>Total Rows:</b>
            <span id="rowCount">-</span>
        </div>

        <div>
            <b>Number of Files:</b>
            <span id="fileCount">-</span>
        </div>

    </div>


    <div id="status"></div>

</div>


<script>

let sourceWorkbook = null;

let selectedSheetName = "";

let sourceWorksheet = null;

let sourceFileName = "";

let zipBlob = null;


/* =====================================================
   FILE UPLOAD
===================================================== */

document
.getElementById("fileInput")
.addEventListener(
    "change",
    async function(event) {

        const file = event.target.files[0];

        if (!file) {
            return;
        }

        sourceFileName = file.name;

        document.getElementById("fileName")
            .textContent = file.name;

        document.getElementById("status")
            .textContent =
            "Excel read ho raha hai...";

        try {

            /*
             * ExcelJS workbook
             */

            sourceWorkbook =
                new ExcelJS.Workbook();

            await sourceWorkbook.xlsx.load(
                await file.arrayBuffer()
            );


            /*
             * Sheet dropdown
             */

            const sheetSelect =
                document.getElementById(
                    "sheetSelect"
                );

            sheetSelect.innerHTML = "";


            sourceWorkbook.worksheets.forEach(
                function(worksheet) {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        worksheet.name;

                    option.textContent =
                        worksheet.name;

                    sheetSelect.appendChild(
                        option
                    );

                }
            );


            sheetSelect.disabled = false;


            /*
             * First sheet
             */

            if (
                sourceWorkbook.worksheets.length > 0
            ) {

                loadSheet(
                    sourceWorkbook.worksheets[0]
                );

            }


            document.getElementById("status")
                .textContent =
                "Excel loaded successfully.";

        }

        catch(error) {

            console.error(error);

            document.getElementById("status")
                .textContent =
                "Excel read nahi ho paya.";

            alert(
                "Excel read karte waqt error aaya:\n\n" +
                error.message
            );

        }

    }
);


/* =====================================================
   SHEET CHANGE
===================================================== */

document
.getElementById("sheetSelect")
.addEventListener(
    "change",
    function() {

        const worksheet =
            sourceWorkbook.getWorksheet(
                this.value
            );

        loadSheet(worksheet);

    }
);


/* =====================================================
   LOAD SHEET
===================================================== */

function loadSheet(worksheet) {

    if (!worksheet) {
        return;
    }

    sourceWorksheet = worksheet;

    selectedSheetName =
        worksheet.name;


    const columnSelect =
        document.getElementById(
            "columnSelect"
        );

    columnSelect.innerHTML = "";


    /*
     * First row ko header maana jayega
     */

    const headerRow =
        worksheet.getRow(1);


    let lastColumn =
        worksheet.actualColumnCount;


    if (
        !lastColumn ||
        lastColumn < 1
    ) {

        lastColumn = 1;

    }


    for (
        let col = 1;
        col <= lastColumn;
        col++
    ) {

        let header =
            headerRow.getCell(col).value;


        if (
            header === null ||
            header === undefined ||
            String(header).trim() === ""
        ) {

            header =
                "Column " + col;

        }


        const option =
            document.createElement(
                "option"
            );


        option.value = col;

        option.textContent =
            String(header);


        columnSelect.appendChild(
            option
        );

    }


    columnSelect.disabled = false;

    document.getElementById(
        "splitBtn"
    ).disabled = false;


    document.getElementById(
        "rowCount"
    ).textContent =
        Math.max(
            worksheet.actualRowCount - 1,
            0
        );

}


/* =====================================================
   GET CELL VALUE AS TEXT
===================================================== */

function getCellText(cell) {

    if (
        cell === null ||
        cell === undefined
    ) {

        return "";

    }


    let value = cell.value;


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    /*
     * Formula
     */

    if (
        typeof value === "object" &&
        value.formula !== undefined
    ) {

        if (
            value.result !== undefined &&
            value.result !== null
        ) {

            return String(value.result)
                .trim();

        }

        return String(value.formula)
            .trim();

    }


    /*
     * Rich text
     */

    if (
        typeof value === "object" &&
        value.richText
    ) {

        return value.richText
            .map(
                item => item.text || ""
            )
            .join("")
            .trim();

    }


    /*
     * Date
     */

    if (value instanceof Date) {

        return value.toLocaleDateString(
            "en-IN"
        );

    }


    return String(value).trim();

}


/* =====================================================
   SAFE FILE NAME
===================================================== */

function safeFileName(value) {

    let name =
        String(value)
            .trim()
            .replace(
                /[\\\/:*?"<>|]/g,
                "_"
            );


    if (!name) {

        name = "Blank";

    }


    return name;

}


/* =====================================================
   COPY CELL
   Includes:
   - Value
   - Formula
   - Font
   - Fill
   - Border
   - Alignment
   - Number format
   - Protection
===================================================== */

function copyCell(
    sourceCell,
    targetCell
) {

    /*
     * Value
     */

    if (
        sourceCell.value !== undefined
    ) {

        targetCell.value =
            sourceCell.value;

    }


    /*
     * Font
     */

    if (sourceCell.font) {

        targetCell.font =
            JSON.parse(
                JSON.stringify(
                    sourceCell.font
                )
            );

    }


    /*
     * Fill
     */

    if (sourceCell.fill) {

        targetCell.fill =
            JSON.parse(
                JSON.stringify(
                    sourceCell.fill
                )
            );

    }


    /*
     * Border
     */

    if (sourceCell.border) {

        targetCell.border =
            JSON.parse(
                JSON.stringify(
                    sourceCell.border
                )
            );

    }


    /*
     * Alignment
     */

    if (sourceCell.alignment) {

        targetCell.alignment =
            JSON.parse(
                JSON.stringify(
                    sourceCell.alignment
                )
            );

    }


    /*
     * Number Format
     */

    if (sourceCell.numFmt) {

        targetCell.numFmt =
            sourceCell.numFmt;

    }


    /*
     * Protection
     */

    if (sourceCell.protection) {

        targetCell.protection =
            JSON.parse(
                JSON.stringify(
                    sourceCell.protection
                )
            );

    }


    /*
     * Style ID
     */

    if (
        sourceCell.style &&
        sourceCell.style !== 0
    ) {

        targetCell.style =
            sourceCell.style;

    }

}


/* =====================================================
   COPY COLUMN WIDTH
===================================================== */

function copyColumnWidth(
    sourceWorksheet,
    targetWorksheet,
    columnNumber
) {

    const sourceColumn =
        sourceWorksheet.getColumn(
            columnNumber
        );

    const targetColumn =
        targetWorksheet.getColumn(
            columnNumber
        );


    if (
        sourceColumn.width !== undefined
    ) {

        targetColumn.width =
            sourceColumn.width;

    }


    /*
     * Hidden column
     */

    if (
        sourceColumn.hidden !== undefined
    ) {

        targetColumn.hidden =
            sourceColumn.hidden;

    }


    /*
     * Outline level
     */

    if (
        sourceColumn.outlineLevel !== undefined
    ) {

        targetColumn.outlineLevel =
            sourceColumn.outlineLevel;

    }

}


/* =====================================================
   COPY ROW HEIGHT
===================================================== */

function copyRowHeight(
    sourceRow,
    targetRow
) {

    if (
        sourceRow.height !== undefined
    ) {

        targetRow.height =
            sourceRow.height;

    }


    if (
        sourceRow.hidden !== undefined
    ) {

        targetRow.hidden =
            sourceRow.hidden;

    }


    if (
        sourceRow.outlineLevel !== undefined
    ) {

        targetRow.outlineLevel =
            sourceRow.outlineLevel;

    }

}


/* =====================================================
   COPY MERGED CELLS
===================================================== */

function copyHeaderMerges(
    sourceWorksheet,
    targetWorksheet
) {

    /*
     * Header ke merged cells preserve karein
     */

    sourceWorksheet.model.merges.forEach(
        function(range) {

            const parts =
                range.split(":");

            if (parts.length !== 2) {
                return;
            }


            const start =
                sourceWorksheet.getCell(
                    parts[0]
                );

            const end =
                sourceWorksheet.getCell(
                    parts[1]
                );


            /*
             * Sirf wahi merge preserve karein
             * jisme header row included hai
             */

            if (
                start.row === 1 ||
                end.row === 1
            ) {

                try {

                    targetWorksheet.mergeCells(
                        range
                    );

                }
                catch(error) {

                    console.log(
                        "Merge skipped:",
                        range
                    );

                }

            }

        }
    );

}


/* =====================================================
   SPLIT EXCEL
===================================================== */

document
.getElementById("splitBtn")
.addEventListener(
    "click",
    async function() {

        if (!sourceWorksheet) {

            alert(
                "Pehle Excel file select karein."
            );

            return;
        }


        const columnNumber =
            parseInt(
                document.getElementById(
                    "columnSelect"
                ).value
            );


        /*
         * Groups
         */

        const groups =
            new Map();


        const lastRow =
            sourceWorksheet.actualRowCount;


        /*
         * Data rows
         * Row 1 = Header
         */

        for (
            let rowNumber = 2;
            rowNumber <= lastRow;
            rowNumber++
        ) {

            const row =
                sourceWorksheet.getRow(
                    rowNumber
                );


            const cell =
                row.getCell(
                    columnNumber
                );


            let value =
                getCellText(cell);


            if (!value) {

                value = "Blank";

            }


            if (!groups.has(value)) {

                groups.set(
                    value,
                    []
                );

            }


            groups
                .get(value)
                .push(rowNumber);

        }


        if (groups.size === 0) {

            alert(
                "Split karne ke liye data nahi mila."
            );

            return;
        }


        document.getElementById(
            "fileCount"
        ).textContent =
            groups.size;


        document.getElementById(
            "status"
        ).textContent =
            "Split ho raha hai...";


        const zip =
            new JSZip();


        let fileCounter = 0;


        /*
         * Har group ke liye Excel
         */

        for (
            const [
                groupValue,
                rowNumbers
            ] of groups
        ) {

            /*
             * New workbook
             */

            const newWorkbook =
                new ExcelJS.Workbook();


            /*
             * Workbook properties
             */

            newWorkbook.creator =
                sourceWorkbook.creator || "";

            newWorkbook.lastModifiedBy =
                sourceWorkbook.lastModifiedBy || "";

            newWorkbook.created =
                sourceWorkbook.created;

            newWorkbook.modified =
                sourceWorkbook.modified;


            /*
             * New sheet
             */

            const newWorksheet =
                newWorkbook.addWorksheet(
                    selectedSheetName
                );


            /*
             * Page setup copy
             */

            if (
                sourceWorksheet.pageSetup
            ) {

                newWorksheet.pageSetup =
                    JSON.parse(
                        JSON.stringify(
                            sourceWorksheet.pageSetup
                        )
                    );

            }


            /*
             * Views copy
             */

            if (
                sourceWorksheet.views
            ) {

                newWorksheet.views =
                    JSON.parse(
                        JSON.stringify(
                            sourceWorksheet.views
                        )
                    );

            }


            /*
             * Properties
             */

            if (
                sourceWorksheet.properties
            ) {

                newWorksheet.properties =
                    JSON.parse(
                        JSON.stringify(
                            sourceWorksheet.properties
                        )
                    );

            }


            /*
             * Column widths
             */

            const lastColumn =
                sourceWorksheet.actualColumnCount;


            for (
                let col = 1;
                col <= lastColumn;
                col++
            ) {

                copyColumnWidth(
                    sourceWorksheet,
                    newWorksheet,
                    col
                );

            }


            /*
             * Header row copy
             */

            const sourceHeader =
                sourceWorksheet.getRow(1);


            const targetHeader =
                newWorksheet.getRow(1);


            copyRowHeight(
                sourceHeader,
                targetHeader
            );


            for (
                let col = 1;
                col <= lastColumn;
                col++
            ) {

                copyCell(
                    sourceHeader.getCell(col),
                    targetHeader.getCell(col)
                );

            }


            /*
             * Data rows copy
             */

            let targetRowNumber = 2;


            for (
                const sourceRowNumber
                of rowNumbers
            ) {

                const sourceRow =
                    sourceWorksheet.getRow(
                        sourceRowNumber
                    );


                const targetRow =
                    newWorksheet.getRow(
                        targetRowNumber
                    );


                /*
                 * Row height
                 */

                copyRowHeight(
                    sourceRow,
                    targetRow
                );


                /*
                 * All columns
                 */

                for (
                    let col = 1;
                    col <= lastColumn;
                    col++
                ) {

                    const sourceCell =
                        sourceRow.getCell(
                            col
                        );


                    const targetCell =
                        targetRow.getCell(
                            col
                        );


                    copyCell(
                        sourceCell,
                        targetCell
                    );

                }


                targetRowNumber++;

            }


            /*
             * Header merges
             */

            copyHeaderMerges(
                sourceWorksheet,
                newWorksheet
            );


            /*
             * Auto filter
             */

            if (
                sourceWorksheet.autoFilter
            ) {

                try {

                    newWorksheet.autoFilter =
                        {
                            from:
                                sourceWorksheet
                                .autoFilter
                                .from,

                            to:
                                sourceWorksheet
                                .autoFilter
                                .to
                        };

                }
                catch(error) {

                    console.log(
                        "AutoFilter skipped"
                    );

                }

            }


            /*
             * Freeze panes
             */

            if (
                sourceWorksheet.views &&
                sourceWorksheet.views.length
            ) {

                try {

                    const view =
                        sourceWorksheet.views[0];

                    if (
                        view.state ===
                        "frozen"
                    ) {

                        newWorksheet.views = [
                            {
                                state: "frozen",

                                xSplit:
                                    view.xSplit || 0,

                                ySplit:
                                    view.ySplit || 0,

                                topLeftCell:
                                    view.topLeftCell,

                                activeCell:
                                    view.activeCell,

                                showGridLines:
                                    view.showGridLines
                            }
                        ];

                    }

                }
                catch(error) {

                    console.log(
                        "Freeze panes skipped"
                    );

                }

            }


            /*
             * ExcelJS ko XLSX buffer mein convert
             */

            const buffer =
                await newWorkbook.xlsx.writeBuffer();


            /*
             * Safe filename
             */

            const filename =
                safeFileName(
                    groupValue
                ) +
                ".xlsx";


            /*
             * ZIP mein add
             */

            zip.file(
                filename,
                buffer
            );


            fileCounter++;


            document.getElementById(
                "status"
            ).textContent =
                "Processing " +
                fileCounter +
                " / " +
                groups.size +
                "...";


            /*
             * Browser ko breathing time
             */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        0
                    )
            );

        }


        /*
         * ZIP generate
         */

        document.getElementById(
            "status"
        ).textContent =
            "ZIP ban raha hai...";


        zipBlob =
            await zip.generateAsync(
                {
                    type: "blob",
                    compression: "DEFLATE",
                    compressionOptions: {
                        level: 6
                    }
                }
            );


        document.getElementById(
            "downloadBtn"
        ).style.display =
            "inline-block";


        document.getElementById(
            "status"
        ).textContent =
            "Completed! " +
            groups.size +
            " Excel files ready.";

    }
);


/* =====================================================
   DOWNLOAD ZIP
===================================================== */

document
.getElementById("downloadBtn")
.addEventListener(
    "click",
    function() {

        if (!zipBlob) {

            alert(
                "Pehle Excel split karein."
            );

            return;
        }


        const url =
            URL.createObjectURL(
                zipBlob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href = url;

        link.download =
            "Split_Excel_Files.zip";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            function() {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );

    }
);

</script>

</body>
</html>
